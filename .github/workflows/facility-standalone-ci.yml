name: facility-standalone-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facility-standalone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  TZ: UTC

jobs:
  standalone-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Execute the canonical standalone gate on Linux
        run: python scripts/run_release_graph.py --repo . --target ci-standalone --no-reuse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: facility-standalone-linux-evidence
          if-no-files-found: warn
          path: |
            reports/**
            .asklepios/release-receipts/**
            .asklepios/facility-standalone/**

  standalone-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Execute the canonical standalone gate on Windows
        run: python scripts/run_release_graph.py --repo . --target ci-standalone --no-reuse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: facility-standalone-windows-evidence
          if-no-files-found: warn
          path: |
            reports/**
            .asklepios/release-receipts/**
            .asklepios/facility-standalone/**

  standalone-integrated:
    needs: [standalone-linux, standalone-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Recompute the canonical standalone boundary
        run: python scripts/run_release_graph.py --repo . --target ci-standalone-integrated --no-reuse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: facility-standalone-integrated-evidence
          if-no-files-found: warn
          path: |
            reports/**
            .asklepios/release-receipts/**
            .asklepios/facility-standalone/**
