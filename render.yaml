# Asklepios network hub on Render (free web service).
#
# Recommended: Cloudflare Pages (or similar) for the Vite SPA + this hub for Socket.IO.
# Optional single-service: append ` && npm run build:bundle` to buildCommand so `dist/`
# exists; the hub then serves the SPA when present (see server/index.ts).
#
# Free-tier sleep: point UptimeRobot (or similar) at GET /api/health every ~5 minutes.
services:
  - type: web
    name: asklepios-hub
    runtime: node
    plan: free
    # Include devDependencies so tsx is available for start:hub on the free tier.
    buildCommand: npm ci --include=dev
    startCommand: npm run start:hub
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASKLEPIOS_CORS_ORIGIN
        # Must list the real browser origin(s): Cloudflare Pages URL, and/or this
        # Render URL when serving SPA from the same hub (comma-separated).
        # Example: https://asklepios.pages.dev,https://asklepios-hub.onrender.com
        value: https://project-asklepios.vercel.app
