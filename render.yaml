services:
  - type: web
    name: asklepios-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:hub
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASKLEPIOS_CORS_ORIGIN
        value: https://project-asklepios.vercel.app
